[pytest]
# Independent minimal configuration for the repository-level runtime probes
# (tests/test_runtime_*.py). The repository root pyproject.toml configures the host
# application with pytest-asyncio options; that plugin is not a dependency of this
# contracts package, so loading it here produced an unknown-config-option warning.
# Any config drift must fail instead of warning (DS-P01-10 P2-2).
filterwarnings =
    error::pytest.PytestConfigWarning
