[project]
name = "centn-runtime-example"
version = "0.1.1"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "agent-runtime[storage,provider]>=0.1.0,<2",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
ecosystem = ["opensandbox==0.1.16"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centn_example"]

[tool.uv.sources]
agent-runtime = { path = "../..", editable = true }

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1.2,<2", "httpx>=0.28,<1", "playwright>=1.50,<2"]
