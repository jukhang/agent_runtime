<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>centn Runtime</title><link rel="stylesheet" href="/ui/style.css"></head>
<body>
<aside><h1><span class="brand-mark" aria-hidden="true">c</span> centn <span class="brand-caption">Runtime</span></h1><button id="new"><span aria-hidden="true">＋</span> 新建对话</button><p class="nav-caption">对话记录</p><nav id="sessions" aria-label="会话"></nav><div class="sidebar-foot">迅腾睿水 · Agent Runtime</div></aside>
<main><header><span id="agent">Agent</span><span id="status" role="status">未连接</span><div id="controls"><button data-control="pause">暂停</button><button data-control="resume">继续</button><button data-control="cancel">取消</button></div></header>
<section id="timeline" aria-label="对话"><div id="empty-state"><div class="empty-mark" aria-hidden="true">c</div><h2>有什么可以帮你？</h2><p>提一个问题，或开始一项任务</p></div><section id="plans" aria-label="任务计划"></section><section id="messages"></section><section id="tools" aria-label="工具进度"></section><section id="artifacts"></section><section id="approvals" aria-label="审批"></section><section id="requests" aria-live="polite"></section></section>
<footer><p id="error" role="alert"></p><details id="resource-panel"><summary>资料</summary><div id="resource-list"></div><label>资料类型<select id="resource-kind"><option value="attachment">附件</option><option value="knowledge">知识来源</option></select></label><input id="resource-file" type="file" accept=".txt,.md,.csv,.json" aria-label="上传文本资料"></details><label id="reply-label" hidden>发送到<select id="reply-target" aria-label="回复问题或新任务"></select></label><form id="composer"><textarea id="input" aria-label="消息" placeholder="输入问题或任务" rows="2" required></textarea><div class="composer-bar"><span id="mode-label">Agent</span><button type="submit" id="send" aria-label="发送" title="发送"><span aria-hidden="true">↑</span></button></div></form><small>AI 生成内容，请核对重要信息。</small></footer></main>
<dialog id="resource-dialog"><button id="resource-close" aria-label="关闭资料预览">关闭</button><h2 id="resource-title"></h2><pre id="resource-text"></pre></dialog>
<dialog id="login"><form id="credentials"><h2>连接 Runtime</h2><label>宿主访问令牌<input id="token" type="password" required autocomplete="off"></label><button>连接</button><p id="login-error" role="alert"></p></form></dialog>
<script type="module" src="/ui/app.mjs"></script></body></html>
